<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Словолупа · PDF и DjVu</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #254737; background: #f2f5ee; font: 15px/1.6 system-ui, sans-serif; }
  header, main { max-width: 1440px; margin: auto; padding: 28px clamp(16px, 4vw, 42px); }
  header { border-bottom: 1px solid #ced9cd; }
  h1 { font: 36px Georgia, serif; margin: 0 0 12px; }
  header p { margin: 0 0 16px; color: #536759; }
  label { display: block; font-weight: 600; margin-bottom: 5px; }
  input { max-width: 100%; }
  input::file-selector-button { background: #174b3e; color: white; border: 0; border-radius: 7px; padding: 9px 14px; margin-right: 10px; cursor: pointer; }
  .reader-actions { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 1000; display: flex; gap: 4px; max-width: calc(100vw - 24px); padding: 5px; border: 1px solid #b8cbbd; border-radius: 9px; background: #f7faf5ee; box-shadow: 0 5px 20px #18352833; backdrop-filter: blur(6px); }
  .reader-actions button { display: grid; place-items: center; width: 34px; height: 34px; padding: 5px; border: 1px solid #b8cbbd; border-radius: 6px; background: #f7faf5; color: #20533e; cursor: pointer; }
  .reader-actions svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .reader-actions button:hover:not(:disabled) { background: #e5f0e5; } .reader-actions button:disabled { opacity: .55; cursor: not-allowed; }
  section { background: #fff; border: 1px solid #d8e1d7; border-radius: 12px; padding: 12px clamp(14px, 5vw, 36px) 20px; margin: 0 0 18px; }
  section h2 { color: #5d7364; font-size: 13px; font-weight: 600; }
  .page-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(16px, 3vw, 34px); align-items: start; }
  .pdf-preview { display: grid; place-items: center; width: 100%; border: 1px solid #d8e1d7; background: #fff; overflow: hidden; color: #536759; }
  .pdf-preview canvas { display: block; width: 100%; height: auto; }
  .page-columns h3 { font-size: 13px; margin: 0; color: #5d7364; }
  @media (max-width: 700px) { .page-columns { grid-template-columns: minmax(0, 1fr); } }
  section p { color: #263d30; font: 18px/1.75 Georgia, serif; overflow-wrap: anywhere; white-space: pre-wrap; }
  [role=status] { overflow-wrap: anywhere; color: #536759; }
</style>
<header>
  <h1>Словолупа · PDF и DjVu</h1>
  <p>Откройте документ, чтобы увидеть оригинальные страницы и текст для анализа. Щёлкните по абзацу в текстовой колонке или выделите текст мышью. Файл обрабатывается на вашем устройстве.</p>
  <label for="file">Файл PDF или DjVu</label>
  <input id="file" type="file" accept=".pdf,.djvu,.djv,application/pdf,image/vnd.djvu,image/x-djvu" disabled>
</header>
<main>
  <div id="status" role="status">Выберите файл, чтобы открыть его в режиме чтения.</div>
  <article id="document" aria-label="Страницы документа"></article>
</main>
<div class="reader-actions" aria-label="Закладки чтения">
  <button id="save-bookmark" type="button" disabled aria-label="Сохранить закладку" title="Сохранить закладку">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M12 7v6M9 10h6"/></svg>
  </button>
  <button id="open-bookmark" type="button" disabled aria-label="Открыть закладку" title="Открыть закладку">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M9 10h6M12 7l3 3-3 3"/></svg>
  </button>
</div>
<script src="content.js"></script>
<script type="module" src="pdf-reader.mjs"></script>
</html>
